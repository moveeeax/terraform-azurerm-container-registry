name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false

      - name: fmt
        run: tofu fmt -check -recursive

      - name: init
        run: tofu init -backend=false

      - name: validate
        run: tofu validate

      - name: test
        run: tofu test

      - name: validate and plan-test every example
        run: |
          set -euo pipefail
          for dir in examples/*/; do
            echo "::group::${dir}"
            (
              cd "${dir}"
              tofu init -backend=false
              tofu validate
              tofu test
            )
            echo "::endgroup::"
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: terraform-linters/setup-tflint@v6

      - name: tflint --init
        run: tflint --init

      - name: tflint
        run: tflint --recursive --format compact
